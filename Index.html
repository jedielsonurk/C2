<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romão Cred - Simulador de Portfólio e Giro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-amber-400">Romão Cred</h1>
            <p class="text-slate-400">Simulador Avançado de Giro, Prazos e Diversificação de Capital</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
                <h2 class="text-xl font-semibold text-amber-300 border-b border-slate-700 pb-2">Parâmetros do Sistema</h2>

                <div>
                    <label class="block text-sm font-medium text-slate-300">Capital Inicial Total (R$)</label>
                    <input type="number" id="capitalInicial" value="6000" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-amber-400 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300">Tempo de Simulação (Semanas)</label>
                    <input type="number" id="tempoSemanas" value="12" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-amber-400 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300">Valor Médio por Empréstimo (R$)</label>
                    <input type="number" id="valorTicket" value="1000" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-amber-400 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300">Prazo do Contrato (Semanas)</label>
                    <input type="number" id="prazoContrato" value="4" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-amber-400 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300">Taxa de Juros Semanal (%)</label>
                    <input type="number" step="0.1" id="taxaSemanal" value="3" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-amber-400 outline-none">
                </div>

                <button onclick="executarSimulacao()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-lg transition-all shadow-md">
                    Calcular Giro e Projeção
                </button>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                        <span class="text-xs text-slate-400 uppercase tracking-wider">Capital Final Estimado</span>
                        <h3 id="resCapitalFinal" class="text-2xl font-bold text-amber-400 mt-1">R$ 0,00</h3>
                    </div>
                    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                        <span class="text-xs text-slate-400 uppercase tracking-wider">Total de Lucro Bruto</span>
                        <h3 id="resLucroTotal" class="text-2xl font-bold text-emerald-400 mt-1">R$ 0,00</h3>
                    </div>
                    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow">
                        <span class="text-xs text-slate-400 uppercase tracking-wider">Contratos Gerados</span>
                        <h3 id="resContratos" class="text-2xl font-bold text-blue-400 mt-1">0</h3>
                    </div>
                </div>

                <div class="bg-slate-800 rounded-xl border border-slate-700 shadow overflow-hidden">
                    <div class="p-4 border-b border-slate-700">
                        <h3 class="font-semibold text-slate-200">Evolução do Fluxo de Caixa Semanal</h3>
                    </div>
                    <div class="overflow-x-auto max-h-[400px]">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-900 text-slate-400 sticky top-0">
                                <tr>
                                    <th class="p-3">Semana</th>
                                    <th class="p-3">Entradas (Parcelas)</th>
                                    <th class="p-3">Caixa Acumulado</th>
                                    <th class="p-3">Novos Empréstimos</th>
                                    <th class="p-3">Sobra em Caixa</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaCorpo" class="divide-y divide-slate-700 text-slate-300">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function executarSimulacao() {
            let capitalInicial = parseFloat(document.getElementById('capitalInicial').value) || 0;
            let tempoSemanas = parseInt(document.getElementById('tempoSemanas').value) || 1;
            let valorTicket = parseFloat(document.getElementById('valorTicket').value) || 1;
            let prazoContrato = parseInt(document.getElementById('prazoContrato').value) || 1;
            let taxaSemanal = (parseFloat(document.getElementById('taxaSemanal').value) || 0) / 100;

            let caixaDisponivel = capitalInicial;
            let contratosAtivos = [];
            let totalLucroAcumulado = 0;
            let totalContratosCriados = 0;
            let htmlTabela = "";

            let qtdInicialContratos = Math.floor(capitalInicial / valorTicket);
            let sobraCaixaInicial = capitalInicial % valorTicket;
            let valorParcelaUnitaria = (valorTicket * (1 + (taxaSemanal * prazoContrato))) / prazoContrato;

            for (let i = 0; i < qtdInicialContratos; i++) {
                contratosAtivos.push({
                    valorPrincipal: valorTicket,
                    parcelasRestantes: prazoContrato,
                    valorParcela: valorParcelaUnitaria
                });
                totalContratosCriados++;
            }
            caixaDisponivel = sobraCaixaInicial;

            for (let semana = 1; semana <= tempoSemanas; semana++) {
                let entradasSemana = 0;
                let novosContratosAtivos = [];

                contratosAtivos.forEach(c => {
                    if (c.parcelasRestantes > 0) {
                        entradasSemana += c.valorParcela;
                        let jurosRecebidosNaParcela = (c.valorPrincipal * taxaSemanal);
                        totalLucroAcumulado += jurosRecebidosNaParcela / prazoContrato;
                        
                        c.parcelasRestantes--;
                        if (c.parcelasRestantes > 0) {
                            novosContratosAtivos.push(c);
                        }
                    }
                });
                contratosAtivos = novosContratosAtivos;
                caixaDisponivel += entradasSemana;

                let novosEmprestimosFeitosNestaSemana = 0;
                while (caixaDisponivel >= valorTicket) {
                    caixaDisponivel -= valorTicket;
                    contratosAtivos.push({
                        valorPrincipal: valorTicket,
                        parcelasRestantes: prazoContrato,
                        valorParcela: valorParcelaUnitaria
                    });
                    novosEmprestimosFeitosNestaSemana++;
                    totalContratosCriados++;
                }

                htmlTabela += `
                    <tr>
                        <td class="p-3 font-semibold text-amber-400">Semana ${semana}</td>
                        <td class="p-3 text-emerald-400">R$ ${entradasSemana.toFixed(2)}</td>
                        <td class="p-3">R$ ${(caixaDisponivel + (novosEmprestimosFeitosNestaSemana * valorTicket)).toFixed(2)}</td>
                        <td class="p-3 text-blue-400">${novosEmprestimosFeitosNestaSemana} (R$ ${novosEmprestimosFeitosNestaSemana * valorTicket})</td>
                        <td class="p-3">R$ ${caixaDisponivel.toFixed(2)}</td>
                    </tr>
                `;
            }

            let principalAtivoRodando = contratosAtivos.reduce((acc, curr) => acc + curr.valorPrincipal, 0);
            let patrimonioFinal = caixaDisponivel + principalAtivoRodando;

            document.getElementById('resCapitalFinal').innerText = `R$ ${patrimonioFinal.toFixed(2)}`;
            document.getElementById('resLucroTotal').innerText = `R$ ${totalLucroAcumulado.toFixed(2)}`;
            document.getElementById('resContratos').innerText = totalContratosCriados;
            document.getElementById('tabelaCorpo').innerHTML = htmlTabela;
        }

        window.onload = executarSimulacao;
    </script>
</body>
</html>
